############################
## HUGO MODULES
## Install or uninstall themes and plugins here.
## Docs: https://gohugo.io/hugo-modules/
############################

imports:
  - path: github.com/HugoBlox/kit/modules/integrations/netlify
  - path: github.com/HugoBlox/kit/modules/blox
  - path: github.com/HugoBlox/kit/modules/slides

# Install any Hugo Blox within the `hugo-blox/blox/` folder
mounts:
  - source: hugo-blox/blox/community
    target: layouts/_partials/blox/community/
    includeFiles: '**.html'
  - source: hugo-blox/blox/all-access
    target: layouts/_partials/blox/
    includeFiles: '**.html'
  - source: hugo-blox/blox
    target: assets/dist/community/blox/
    includeFiles: '**.css'
  # Content per language: translated files in content_it/ and content_de/ come first (the first mount wins
  # when the same path exists twice); English content is then shared with all languages as fallback.
  - source: content_it
    target: content
    sites:
      matrix:
        languages: ["it"]
  - source: content_de
    target: content
    sites:
      matrix:
        languages: ["de"]
  - source: content
    target: content
    sites:
      matrix:
        languages: ["**"]
  - source: layouts
    target: layouts
  - source: assets
    target: assets
